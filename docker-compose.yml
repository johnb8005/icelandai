version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icelandai-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/hello"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - icelandai-network

networks:
  icelandai-network:
    driver: bridge
